services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    volumes:
      - timescale_data:/home/postgres/pgdata/data
    environment:
      POSTGRES_DB: ${DB_NAME:-givself}
      POSTGRES_USER: ${DB_USER:-givself}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-givself}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ../givself-server
    restart: unless-stopped
    ports:
      - "3002:3002"
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      PORT: 3002
      DATABASE_URL: postgres://${DB_USER:-givself}:${DB_PASSWORD}@timescaledb:5432/${DB_NAME:-givself}
      ADAPTER_TYPE: ${ADAPTER_TYPE:-givenergy}
      INVERTER_HOST: ${INVERTER_HOST:?INVERTER_HOST required}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-10000}
      GIVENERGY_API_KEY: ${GIVENERGY_API_KEY:-}
      GIVENERGY_INVERTER_SERIAL: ${GIVENERGY_INVERTER_SERIAL:-}
      SOLCAST_API_KEY: ${SOLCAST_API_KEY:-}
      SOLCAST_SITE_ID: ${SOLCAST_SITE_ID:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/api/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build: ../givself-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      HOSTNAME: 0.0.0.0

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - server
      - web

volumes:
  timescale_data:
