services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: givself-db
    restart: unless-stopped
    volumes:
      - timescale_data:/home/postgres/pgdata/data
    environment:
      POSTGRES_DB: ${DB_NAME:-givself}
      POSTGRES_USER: ${DB_USER:-givself}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env or environment}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-givself}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: ghcr.io/givself/server:latest
    container_name: givself-server
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-3032}:${SERVER_PORT:-3032}"
    environment:
      PORT: ${SERVER_PORT:-3032}
      DATABASE_URL: postgres://${DB_USER:-givself}:${DB_PASSWORD}@timescaledb:5432/${DB_NAME:-givself}
      ADAPTER_TYPE: ${ADAPTER_TYPE:-givenergy}
      INVERTER_HOST: ${INVERTER_HOST:-192.168.1.100}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-10000}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${SERVER_PORT:-3032}/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    image: ghcr.io/givself/web:latest
    container_name: givself-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3033}:3000"
    environment:
      HOSTNAME: "0.0.0.0"
      API_URL: "http://server:${SERVER_PORT:-3032}"
      WS_URL: "ws://${WS_HOST:-localhost}:${SERVER_PORT:-3032}"

volumes:
  timescale_data:
