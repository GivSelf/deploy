## GivSelf — Unraid Docker Compose
##
## Usage:
##   1. Copy this file and .env to your Unraid server
##   2. Edit .env with your settings
##   3. docker compose -f docker-compose.unraid.yml up -d
##
## Images are pulled from GitHub Container Registry (ghcr.io)
## No local build required.

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: givself-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-givself}
      POSTGRES_USER: ${DB_USER:-givself}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - ${DATA_PATH:-/mnt/user/appdata/givself}/db:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-givself}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: ghcr.io/givself/server:latest
    container_name: givself-server
    restart: unless-stopped
    ports:
      - "3002:3002"
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      PORT: 3002
      DATABASE_URL: postgres://${DB_USER:-givself}:${DB_PASSWORD}@timescaledb:5432/${DB_NAME:-givself}
      ADAPTER_TYPE: ${ADAPTER_TYPE:-givenergy}
      INVERTER_HOST: ${INVERTER_HOST:?Set INVERTER_HOST in .env}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-10000}
      GIVENERGY_API_KEY: ${GIVENERGY_API_KEY:-}
      GIVENERGY_INVERTER_SERIAL: ${GIVENERGY_INVERTER_SERIAL:-}
      SOLCAST_API_KEY: ${SOLCAST_API_KEY:-}
      SOLCAST_SITE_ID: ${SOLCAST_SITE_ID:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    image: ghcr.io/givself/web:latest
    container_name: givself-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      HOSTNAME: 0.0.0.0

volumes: {}
