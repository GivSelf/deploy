services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: givself
      POSTGRES_USER: givself
      POSTGRES_PASSWORD: givself_dev
    volumes:
      - timescale_data:/home/postgres/pgdata/data

volumes:
  timescale_data:
